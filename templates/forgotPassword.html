{% extends "layout.html" %}

{% block title %}
    Forgot Password
{% endblock %}

{% block main %}
<div class="container py-5">
  <div class="row justify-content-center align-items-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-4 mb-3"
             style="width: 76px; height: 76px; background-color: #e8f0f8; color: #0b2545;">
          <i class="bi bi-key display-5"></i>
        </div>

        <h1 class="fw-bold mb-2" style="color: #0b2545;">Forgot Password?</h1>
        <p class="text-secondary mb-0">
          Don't worry. Enter your email address to get started with resetting your password.
        </p>
      </div>

      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4 p-md-5">

          <form action="/forgot-password" method="post">

            <div class="form-floating mb-4">
              <input type="email"
                     class="form-control"
                     name="email"
                     id="mail"
                     placeholder="Email Address"
                     autocomplete="email"
                     value="{{ email | default('', true) }}"
                     required>
              <label for="mail">
                <i class="bi bi-envelope me-2"></i>Email Address
              </label>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100 py-2 fw-semibold rounded-3">
              <i class="bi bi-send me-2"></i>Reset Password
            </button>

          </form>

          <div class="text-center mt-4">
            <a href="/login"
               class="text-decoration-none fw-semibold"
               style="color: #0b2545;">
              <i class="bi bi-arrow-left me-2"></i>Back to Login
            </a>
          </div>

        </div>
      </div>

      <p class="text-center text-secondary small mt-4 mb-0">
        If you have trouble accessing your account, contact support.
      </p>

    </div>
  </div>
</div>
{% endblock %}
