{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block main %}
<div class="container py-5">
  <div class="row justify-content-center align-items-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-4 mb-3"
             style="width: 76px; height: 76px; background-color: #e8f0f8; color: #0b2545;">
          <i class="bi bi-person-lock display-5"></i>
        </div>

        <h1 class="fw-bold mb-2" style="color: #0b2545;">Welcome Back</h1>
        <p class="text-secondary mb-0">Log in to continue to SmartLine.</p>
      </div>

      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4 p-md-5">

          <form action="/login" method="post"
                onsubmit="this.querySelector('button[type=submit]').disabled=true;">

            <div class="form-floating mb-3">
              <input autocomplete="off"
                     autofocus
                     class="form-control"
                     name="email"
                     placeholder="Email Address"
                     type="email"
                     id="mail"
                     value="{{ email }}"
                     required>
              <label for="mail">
                <i class="bi bi-envelope me-2"></i>Email Address
              </label>
            </div>

            <div class="form-floating mb-2">
              <input class="form-control"
                     name="password"
                     id="password"
                     placeholder="Password"
                     type="password"
                     autocomplete="current-password"
                     required>
              <label for="password">
                <i class="bi bi-lock me-2"></i>Password
              </label>
            </div>

            <div class="text-end mb-4">
              <a href="/forgot-password"
                 class="small text-decoration-none fw-semibold"
                 style="color: #0b2545;">
                Forgot Password?
              </a>
            </div>

            <button class="btn btn-primary w-100 py-2 fw-semibold rounded-3"
                    type="submit">
              <i class="bi bi-box-arrow-in-right me-2"></i>Log In
            </button>

          </form>

          <div class="position-relative my-4">
            <hr class="text-secondary opacity-25">
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-secondary">
              OR
            </span>
          </div>

          <a href="/guest"
             class="btn btn-outline-secondary w-100 py-2 fw-semibold rounded-3">
            <i class="bi bi-person me-2"></i>Continue as Guest
          </a>

        </div>
      </div>

      <p class="text-center text-secondary small mt-4 mb-0">
        SmartLine &mdash; Smarter queues, better waiting experiences.
      </p>

    </div>
  </div>
</div>
{% endblock %}
