{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <form action="/register" method="post" onsubmit="this.querySelector('button[type=submit]').disabled=true;">
        <div class="mb-3">
            <input name="email" autocomplete="off" autofocus type="email" placeholder="email" id="mail">
        </div>
        <div class="mb-3">
            <input name="name" autocomplete="off" type="text" placeholder="name">
        </div>
        <div class="mb-3">
            <input name="password" autocomplete="off" type="password" placeholder="password">
        </div>
        <div class="mb-3">
            <input name="confirmation" autocomplete="off" type="password" placeholder="confirmation password">
        </div>
        <button class="btn btn-primary" type="submit"> Register </button>
    </form>
{% endblock %}
