{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
<div class="container d-flex justify-content-center align-items-center py-5">

    <div class="card border-0 shadow-sm rounded-4 w-100" style="max-width: 480px;">
        <div class="card-body p-4 p-md-5">

            <!-- Header -->
            <div class="text-center mb-4">
                <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center mb-3"
                     style="width: 64px; height: 64px;">
                    <i class="bi bi-person-plus fs-2"></i>
                </div>

                <h1 class="h3 fw-bold mb-2">Create Your Account</h1>
                <p class="text-secondary mb-0">
                    Register to get started with SmartLine.
                </p>
            </div>

            <!-- Registration Form -->
            <form action="/register" method="post"
                  onsubmit="this.querySelector('button[type=submit]').disabled=true;">

                <div class="mb-3">
                    <label for="registerEmail" class="form-label fw-semibold">
                        Email Address
                    </label>
                    <input
                        name="email"
                        autocomplete="off"
                        autofocus
                        type="email"
                        placeholder="name@example.com"
                        id="registerEmail"
                        value="{{ email }}"
                        class="form-control form-control-lg"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="registerName" class="form-label fw-semibold">
                        Full Name
                    </label>
                    <input
                        name="name"
                        autocomplete="off"
                        type="text"
                        placeholder="Enter your full name"
                        value="{{ name }}"
                        minlength="3"
                        maxlength="40"
                        id="registerName"
                        class="form-control form-control-lg"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="registerPass" class="form-label fw-semibold">
                        Password
                    </label>
                    <input
                        name="password"
                        autocomplete="off"
                        type="password"
                        placeholder="Create a password"
                        required
                        minlength="8"
                        id="registerPass"
                        class="form-control form-control-lg"
                    >
                    <div class="form-text">
                        Use at least 8 characters.
                    </div>
                </div>

                <div class="mb-4">
                    <label for="registerConfirmation" class="form-label fw-semibold">
                        Confirm Password
                    </label>
                    <input
                        name="confirmation"
                        autocomplete="off"
                        type="password"
                        placeholder="Enter your password again"
                        required
                        minlength="8"
                        id="registerConfirmation"
                        class="form-control form-control-lg"
                    >
                </div>

                <button class="btn btn-primary btn-lg w-100 fw-semibold" type="submit">
                    <i class="bi bi-person-check me-2"></i>
                    Register
                </button>

            </form>

            <div class="text-center mt-4">
                <p class="text-secondary small mb-0">
                    Already have an account?
                    <a href="/login" class="text-decoration-none fw-semibold">Log In</a>
                </p>
            </div>

        </div>
    </div>

</div>
{% endblock %}
