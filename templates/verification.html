{% extends "layout.html" %}

{% block title %}
    Verification
{% endblock %}

{% block main %}
<div class="container py-5">
  <div class="row justify-content-center align-items-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-4 mb-3"
             style="width: 76px; height: 76px; background-color: #e8f0f8; color: #0b2545;">
          <i class="bi bi-envelope-check display-5"></i>
        </div>

        <h1 class="fw-bold mb-2" style="color: #0b2545;">Verify Your Email</h1>
        <p class="text-secondary mb-0">
          Enter the verification code sent to your email address.
        </p>
      </div>

      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4 p-md-5">

          <form action="/verification" method="post">

            <div class="form-floating mb-4">
              <input type="text"
                     class="form-control text-center fw-bold"
                     placeholder="OTP"
                     name="code"
                     id="code"
                     autocomplete="one-time-code"
                     inputmode="numeric"
                     maxlength="6"
                     required>
              <label for="code">
                <i class="bi bi-shield-lock me-2"></i>Verification Code
              </label>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100 py-2 fw-semibold rounded-3">
              <i class="bi bi-check-circle me-2"></i>Verify
            </button>

          </form>

          <div class="text-center mt-4">
            <small class="text-secondary">
              Check your inbox and spam folder if you can't find the code.
            </small>
          </div>

        </div>
      </div>

      <p class="text-center text-secondary small mt-4 mb-0">
        SmartLine &mdash; Secure account verification.
      </p>

    </div>
  </div>
</div>
{% endblock %}
